name: CD — Deploy to Azure

on:
  # Triggers ONLY after CI workflow completes on main
  workflow_run:
    workflows: ["CI"]  # must match the name: field inside ci.yml exactly
    types: [completed]
    branches: [main]
  # Manual emergency deploy (e.g. hotfix already merged)
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  RESOURCE_GROUP: rg-pivot-app
  ACA_ENVIRONMENT: env-pivot-prod
  BACKEND_APP: pivot-backend
  FRONTEND_APP: pivot-frontend

jobs:
  # Gate: abort if CI failed or was cancelled
  check-ci:
    name: Verify CI Success
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed — proceeding with deploy"

  migrate:
    name: Run Database Migrations
    needs: [check-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Wake up Neon database
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx prisma generate
          node -e "
            const { PrismaClient } = require('./node_modules/.prisma/client');
            const p = new PrismaClient();
            p.\$queryRaw\`SELECT 1\`.then(() => { console.log('✅ Database is awake'); p.\$disconnect(); }).catch(e => { console.warn('⚠️ Wake-up query failed, continuing...', e.message); p.\$disconnect(); });
          "
          sleep 3

      - name: Run Prisma Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: "${{ secrets.DIRECT_URL }}&connect_timeout=30"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Run Seed
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run seed

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [migrate]

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend (create or update)
        uses: azure/cli@v2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        with:
          azcliversion: latest
          inlineScript: |
            BACKEND_IMAGE="${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest"
            ENV_ID=$(az containerapp env show -n ${{ env.ACA_ENVIRONMENT }} -g ${{ env.RESOURCE_GROUP }} --query id -o tsv)

            if az containerapp show \
                --name ${{ env.BACKEND_APP }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --output none 2>/dev/null; then

              echo ">>> Backend existe — atualizando..."
              az containerapp secret set \
                --name ${{ env.BACKEND_APP }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --secrets "database-url=$DATABASE_URL" "direct-url=$DIRECT_URL"

              az containerapp update \
                --name ${{ env.BACKEND_APP }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --image "$BACKEND_IMAGE" \
                --min-replicas 0 \
                --max-replicas 1 \
                --set-env-vars \
                  "DATABASE_URL=secretref:database-url" \
                  "DIRECT_URL=secretref:direct-url" \
                  "PORT=3000" \
                  "CORS_ORIGIN=${{ vars.FRONTEND_URL }}"
            else
              echo ">>> Backend nao existe — criando..."
              az containerapp create \
                --name ${{ env.BACKEND_APP }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --environment "$ENV_ID" \
                --image "$BACKEND_IMAGE" \
                --target-port 3000 \
                --ingress external \
                --min-replicas 0 \
                --max-replicas 1 \
                --liveness-probe-path /api/health/live \
                --readiness-probe-path /api/health/ready \
                --secrets "database-url=$DATABASE_URL" "direct-url=$DIRECT_URL" \
                --env-vars \
                  "DATABASE_URL=secretref:database-url" \
                  "DIRECT_URL=secretref:direct-url" \
                  "PORT=3000" \
                  "CORS_ORIGIN=${{ vars.FRONTEND_URL }}"
            fi

      - name: Get Backend FQDN
        uses: azure/cli@v2
        id: backend-fqdn
        with:
          azcliversion: latest
          inlineScript: |
            FQDN=$(az containerapp show \
              --name ${{ env.BACKEND_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query properties.configuration.ingress.fqdn -o tsv)
            echo "BACKEND_FQDN=$FQDN" >> $GITHUB_OUTPUT
            echo "Backend FQDN: $FQDN"

      - name: Deploy Frontend (create or update)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest"
            ENV_ID=$(az containerapp env show -n ${{ env.ACA_ENVIRONMENT }} -g ${{ env.RESOURCE_GROUP }} --query id -o tsv)
            BACKEND_URL="https://${{ steps.backend-fqdn.outputs.BACKEND_FQDN }}"

            if az containerapp show \
                --name ${{ env.FRONTEND_APP }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --output none 2>/dev/null; then

              echo ">>> Frontend existe — atualizando..."
              az containerapp update \
                --name ${{ env.FRONTEND_APP }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --image "$FRONTEND_IMAGE" \
                --min-replicas 0 \
                --max-replicas 1 \
                --set-env-vars "BACKEND_URL=$BACKEND_URL"
            else
              echo ">>> Frontend nao existe — criando..."
              az containerapp create \
                --name ${{ env.FRONTEND_APP }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --environment "$ENV_ID" \
                --image "$FRONTEND_IMAGE" \
                --target-port 80 \
                --ingress external \
                --min-replicas 0 \
                --max-replicas 1 \
                --env-vars "BACKEND_URL=$BACKEND_URL"
            fi
