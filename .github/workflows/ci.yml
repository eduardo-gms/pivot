name: CI

on:
  push:
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: ./frontend
      - run: npm test
        working-directory: ./frontend

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pivot_test
          POSTGRES_PASSWORD: pivot_test_pass
          POSTGRES_DB: pivot_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pivot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: ./backend
      - name: Generate Prisma client
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://pivot_test:pivot_test_pass@localhost:5432/pivot_test_db?schema=public"
          DIRECT_URL: "postgresql://pivot_test:pivot_test_pass@localhost:5432/pivot_test_db?schema=public"
        run: npx prisma generate
      - name: Run unit tests
        run: npm test
        working-directory: ./backend
      - name: Run Prisma migrations (test DB)
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://pivot_test:pivot_test_pass@localhost:5432/pivot_test_db?schema=public"
          DIRECT_URL: "postgresql://pivot_test:pivot_test_pass@localhost:5432/pivot_test_db?schema=public"
        run: npx prisma migrate deploy
      - name: Seed test database
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://pivot_test:pivot_test_pass@localhost:5432/pivot_test_db?schema=public"
          DIRECT_URL: "postgresql://pivot_test:pivot_test_pass@localhost:5432/pivot_test_db?schema=public"
        run: npm run seed
      - name: Run E2E tests
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://pivot_test:pivot_test_pass@localhost:5432/pivot_test_db?schema=public"
          DIRECT_URL: "postgresql://pivot_test:pivot_test_pass@localhost:5432/pivot_test_db?schema=public"
        run: npm run test:e2e

  build-frontend:
    name: Build Frontend (React)
    needs: [test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-backend:
    name: Build Backend (NestJS)
    needs: [test-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
